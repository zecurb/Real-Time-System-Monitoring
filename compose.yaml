services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: rtmonitor
      POSTGRES_USER: rtmonitor
      POSTGRES_PASSWORD: rtmonitor-development-only
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - rtmonitor-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rtmonitor -d rtmonitor"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  rtmonitor-postgres-data:

