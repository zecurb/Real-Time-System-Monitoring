name: Windows Desktop

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    tags: ["v*"]
  pull_request:

permissions:
  contents: write

concurrency:
  group: windows-desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build dashboard
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Install application and packager
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          python -m pip install pyinstaller

      - name: Validate Python
        run: |
          python -m ruff check .
          python -m mypy src
          python -m unittest discover -s tests -v

      - name: Build Windows executable
        shell: pwsh
        run: |
          pyinstaller `
            --noconfirm `
            --clean `
            --onefile `
            --name RealTimeSystemMonitoring `
            --collect-all alembic `
            --collect-all psutil `
            --collect-all sqlalchemy `
            --add-data "frontend/dist;frontend/dist" `
            --add-data "migrations;migrations" `
            --add-data "alembic.ini;." `
            src/rtmonitor/desktop.py

      - name: Smoke test executable and local telemetry
        shell: pwsh
        run: |
          $arguments = @(
            "--no-browser",
            "--port", "8765",
            "--collection-interval", "1"
          )
          $process = Start-Process `
            -FilePath "dist/RealTimeSystemMonitoring.exe" `
            -ArgumentList $arguments `
            -PassThru
          try {
            $ready = $false
            for ($attempt = 0; $attempt -lt 60; $attempt++) {
              try {
                $response = Invoke-WebRequest `
                  -Uri "http://127.0.0.1:8765/health/live" `
                  -UseBasicParsing `
                  -TimeoutSec 2
                if ($response.StatusCode -eq 200) {
                  $ready = $true
                  break
                }
              } catch {
                Start-Sleep -Seconds 1
              }
            }
            if (-not $ready) {
              throw "Desktop executable did not become ready"
            }

            $dashboard = Invoke-WebRequest `
              -Uri "http://127.0.0.1:8765/" `
              -UseBasicParsing `
              -TimeoutSec 5
            if ($dashboard.StatusCode -ne 200) {
              throw "Bundled dashboard did not load"
            }

            $nodeDiscovered = $false
            for ($attempt = 0; $attempt -lt 60; $attempt++) {
              try {
                $nodes = Invoke-RestMethod `
                  -Uri "http://127.0.0.1:8765/v1/nodes" `
                  -TimeoutSec 2
                if (@($nodes.nodes).Count -gt 0) {
                  $nodeDiscovered = $true
                  break
                }
              } catch {
                # The collector and first database write may still be starting.
              }
              Start-Sleep -Seconds 1
            }
            if (-not $nodeDiscovered) {
              throw "Packaged Windows collector did not produce telemetry"
            }
          } finally {
            Stop-Process -Id $process.Id -Force -ErrorAction SilentlyContinue
          }

      - uses: actions/upload-artifact@v4
        with:
          name: RealTimeSystemMonitoring-Windows
          path: dist/RealTimeSystemMonitoring.exe
          if-no-files-found: error

      - name: Attach executable to tagged release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.ref_name }}" "dist/RealTimeSystemMonitoring.exe" --clobber
