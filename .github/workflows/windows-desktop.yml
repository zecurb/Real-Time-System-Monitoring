name: Windows Desktop

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    tags: ["v*"]
  pull_request:

permissions:
  contents: write

concurrency:
  group: windows-desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build dashboard
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Install application and packager
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          python -m pip install pyinstaller

      - name: Validate Python
        run: |
          python -m ruff check .
          python -m mypy src
          python -m unittest discover -s tests -v

      - name: Build Windows executable
        shell: pwsh
        run: |
          pyinstaller `
            --noconfirm `
            --clean `
            --onefile `
            --name RealTimeSystemMonitoring `
            --collect-all aiosqlite `
            --collect-all alembic `
            --collect-all psutil `
            --collect-all sqlalchemy `
            --hidden-import sqlalchemy.dialects.sqlite.aiosqlite `
            --add-data "frontend/dist;frontend/dist" `
            --add-data "migrations;migrations" `
            --add-data "alembic.ini;." `
            src/rtmonitor/desktop.py

      - name: Create SHA-256 checksum
        shell: pwsh
        run: |
          $hash = (Get-FileHash `
            -Path "dist/RealTimeSystemMonitoring.exe" `
            -Algorithm SHA256).Hash.ToLower()
          "$hash  RealTimeSystemMonitoring.exe" | Set-Content `
            -Path "dist/RealTimeSystemMonitoring.exe.sha256" `
            -Encoding ascii

      - name: Smoke test executable and local telemetry
        shell: pwsh
        run: |
          $stdoutLog = "dist/desktop-stdout.log"
          $stderrLog = "dist/desktop-stderr.log"
          New-Item -ItemType File -Path $stdoutLog -Force | Out-Null
          New-Item -ItemType File -Path $stderrLog -Force | Out-Null

          function Show-DesktopLogs {
            Write-Host "--- desktop stdout ---"
            Get-Content $stdoutLog -ErrorAction SilentlyContinue
            Write-Host "--- desktop stderr ---"
            Get-Content $stderrLog -ErrorAction SilentlyContinue
          }

          $arguments = @(
            "--no-browser",
            "--port", "8765",
            "--collection-interval", "1"
          )
          $process = Start-Process `
            -FilePath "dist/RealTimeSystemMonitoring.exe" `
            -ArgumentList $arguments `
            -RedirectStandardOutput $stdoutLog `
            -RedirectStandardError $stderrLog `
            -PassThru
          try {
            $ready = $false
            for ($attempt = 0; $attempt -lt 120; $attempt++) {
              $process.Refresh()
              if ($process.HasExited) {
                Show-DesktopLogs
                throw "Desktop executable exited before readiness with code $($process.ExitCode)"
              }
              try {
                $response = Invoke-WebRequest `
                  -Uri "http://127.0.0.1:8765/health/live" `
                  -UseBasicParsing `
                  -TimeoutSec 2
                if ($response.StatusCode -eq 200) {
                  $ready = $true
                  break
                }
              } catch {
                Start-Sleep -Seconds 1
              }
            }
            if (-not $ready) {
              Show-DesktopLogs
              throw "Desktop executable did not become ready"
            }

            $dashboard = Invoke-WebRequest `
              -Uri "http://127.0.0.1:8765/" `
              -UseBasicParsing `
              -TimeoutSec 5
            if ($dashboard.StatusCode -ne 200) {
              Show-DesktopLogs
              throw "Bundled dashboard did not load"
            }

            $nodeDiscovered = $false
            for ($attempt = 0; $attempt -lt 60; $attempt++) {
              $process.Refresh()
              if ($process.HasExited) {
                Show-DesktopLogs
                throw "Desktop executable exited during telemetry validation with code $($process.ExitCode)"
              }
              try {
                $nodes = Invoke-RestMethod `
                  -Uri "http://127.0.0.1:8765/v1/nodes" `
                  -TimeoutSec 2
                if (@($nodes.nodes).Count -gt 0) {
                  $nodeDiscovered = $true
                  break
                }
              } catch {
                # The collector and first database write may still be starting.
              }
              Start-Sleep -Seconds 1
            }
            if (-not $nodeDiscovered) {
              Show-DesktopLogs
              throw "Packaged Windows collector did not produce telemetry"
            }
          } finally {
            if (-not $process.HasExited) {
              Stop-Process -Id $process.Id -Force -ErrorAction SilentlyContinue
            }
            Show-DesktopLogs
          }

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: RealTimeSystemMonitoring-Windows
          path: |
            dist/RealTimeSystemMonitoring.exe
            dist/RealTimeSystemMonitoring.exe.sha256
            dist/desktop-stdout.log
            dist/desktop-stderr.log
          if-no-files-found: warn

      - name: Attach executable to tagged release
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $releaseReady = $false
          for ($attempt = 0; $attempt -lt 30; $attempt++) {
            gh release view "${{ github.ref_name }}" *> $null
            if ($LASTEXITCODE -eq 0) {
              $releaseReady = $true
              break
            }
            Start-Sleep -Seconds 10
          }
          if (-not $releaseReady) {
            throw "The tagged GitHub Release was not created in time"
          }
          gh release upload `
            "${{ github.ref_name }}" `
            "dist/RealTimeSystemMonitoring.exe" `
            "dist/RealTimeSystemMonitoring.exe.sha256" `
            --clobber
