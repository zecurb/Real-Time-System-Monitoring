[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "real-time-system-monitoring"
version = "1.0.0"
description = "Predictive observability with auditable incident workflows"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary" }
authors = [{ name = "Nehemiah Boyce" }]
dependencies = [
  "aiosqlite>=0.21,<1",
  "alembic>=1.18,<2",
  "asyncpg>=0.30,<1",
  "fastapi>=0.115,<1",
  "psutil>=7,<8",
  "pydantic>=2.10,<3",
  "sqlalchemy[asyncio]>=2.0,<3",
  "uvicorn>=0.34,<1",
]

[project.optional-dependencies]
dev = [
  "httpx2>=2,<3",
  "mypy>=1.13",
  "ruff>=0.8",
]

[project.scripts]
rtmonitor = "rtmonitor.cli:main"
rtmonitor-api = "rtmonitor.api.main:run"
rtmonitor-worker = "rtmonitor.pipeline.main:run"
rtmonitor-retention = "rtmonitor.retention:run"
rtmonitor-desktop = "rtmonitor.desktop:run"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src"]
