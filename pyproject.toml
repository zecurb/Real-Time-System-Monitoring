[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "real-time-system-monitoring"
version = "0.1.0"
description = "CPU-only Linux telemetry collector for a predictive observability platform"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary" }
authors = [{ name = "Nehemiah Boyce" }]
dependencies = []

[project.optional-dependencies]
dev = [
  "mypy>=1.13",
  "ruff>=0.8",
]

[project.scripts]
rtmonitor = "rtmonitor.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src"]
